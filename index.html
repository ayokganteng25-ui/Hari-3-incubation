<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan JavaScript Dasar</title>
  <!-- Tailwind CSS CDN untuk tampilan rapi -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-md max-w-md w-full space-y-6">
    <!-- Header -->
    <div class="text-center">
      <h1 class="text-2xl font-bold text-slate-800" id="judul">Form Sapaan & Validasi</h1>
      <p class="text-sm text-slate-500 mt-1">Latihan DOM, Event, dan Validasi Form</p>
    </div>

    <!-- Form Interaktif -->
    <form id="formSapa" class="space-y-4">
      <div>
        <label for="inputNama" class="block text-sm font-semibold text-slate-700 mb-1">Nama Lengkap</label>
        <input 
          type="text" 
          id="inputNama" 
          placeholder="Masukkan nama kamu..." 
          class="w-full px-4 py-2 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500 transition"
        >
      </div>

      <!-- Tombol Submit -->
      <button 
        type="submit" 
        id="btnSapa" 
        class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 rounded-xl transition shadow"
      >
        Kirim Sapaan
      </button>
    </form>

    <!-- Tempat Menampilkan Hasil / Pesan Validasi -->
    <div id="kotakPesan" class="hidden p-4 rounded-xl text-center font-semibold text-sm"></div>
  </div>

  <!-- Menghubungkan File JavaScript Eksternal -->
  <script src="script.js" defer></script>
</body>
</html>
